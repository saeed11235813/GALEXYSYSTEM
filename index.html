<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agency HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed isometric office floor on canvas; frosted panels pinned to the corners; agent dossier slides in from the right (bottom sheet on phones). */
:root {
  --sky: #D6E2EA;
  --sky-hi: #EEF3F6;
  --ink: #1C2532;
  --muted: #586577;
  --panel: rgba(249, 251, 252, 0.88);
  --panel-solid: #F9FBFC;
  --line: #CCD6DF;
  --accent: #2B55D9;
  --chip: #E7EDF2;
  --f-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 14px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--sky);
  color: var(--ink);
  font: 14px/1.5 var(--f-body);
  overflow: hidden;
}
#world {
  position: fixed; inset: 0; width: 100%; height: 100%;
  display: block; touch-action: none; cursor: grab;
  background: radial-gradient(120% 90% at 50% 10%, var(--sky-hi), var(--sky));
}
#world.dragging { cursor: grabbing; }
#world.pointing { cursor: pointer; }

.panel {
  position: fixed; z-index: 2;
  background: var(--panel);
  backdrop-filter: blur(10px) saturate(1.2);
  -webkit-backdrop-filter: blur(10px) saturate(1.2);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: 0 10px 30px -18px rgba(28, 37, 50, 0.45);
}

/* HUD: brand, search, divisions */
.hud {
  top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px;
  width: 300px; max-height: calc(100% - 140px - env(safe-area-inset-top, 0px));
  display: flex; flex-direction: column; gap: 12px; padding: 16px;
}
.eyebrow {
  font: 500 11px/1 var(--f-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
}
h1 {
  margin: 6px 0 4px; font: 800 30px/1 var(--f-display); letter-spacing: -0.02em; text-wrap: balance;
}
.sub { margin: 0; color: var(--muted); }
.search { position: relative; }
.search input {
  width: 100%; padding: 10px 12px 10px 34px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--panel-solid); color: var(--ink);
  font: 500 14px var(--f-body);
}
.search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font: 500 11px var(--f-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }

.list { overflow-y: auto; min-height: 0; margin: 0 -8px; padding: 0 8px; display: flex; flex-direction: column; gap: 2px; }
.list button {
  display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 8px;
  width: 100%; text-align: left; border: 0; background: transparent; color: var(--ink);
  padding: 7px 8px; border-radius: 8px; font: 500 13.5px var(--f-body); cursor: pointer;
}
.list button:hover, .list button:focus-visible { background: var(--chip); outline: none; }
.list .sw { width: 12px; height: 12px; border-radius: 4px; justify-self: center; box-shadow: inset 0 -2px 0 rgba(0,0,0,.15); }
.list .em { font-size: 16px; justify-self: center; line-height: 1; }
.list .n { font: 500 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.list .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .nm small { display: block; color: var(--muted); font-size: 11.5px; font-weight: 400; overflow: hidden; text-overflow: ellipsis; }
.empty { color: var(--muted); padding: 8px; }
.toggle { display: none; }

/* Live floor stats */
.stats {
  left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 18px; padding: 10px 16px; align-items: center;
}
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font: 700 18px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font: 500 10.5px/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }

/* Camera controls */
.controls {
  right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 4px; padding: 5px;
}
.controls button {
  width: 38px; height: 38px; border-radius: 9px; border: 0; background: transparent; color: var(--ink);
  font: 600 18px var(--f-body); cursor: pointer; display: grid; place-items: center;
}
.controls button:hover, .controls button:focus-visible { background: var(--chip); outline: none; }

/* Agent dossier */
.drawer {
  top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  width: min(440px, calc(100% - 32px));
  display: flex; flex-direction: column; overflow: hidden;
  transform: translateX(calc(100% + 24px)); transition: transform .35s cubic-bezier(.2,.8,.2,1);
  background: var(--panel-solid);
}
.drawer.open { transform: none; }
.dhead { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: start; }
.avatar { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font-size: 28px; }
.dhead h2 { margin: 2px 0 6px; font: 700 21px/1.15 var(--f-display); text-wrap: balance; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 500 11px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; padding: 5px 8px; border-radius: 6px; background: var(--chip); color: var(--ink); }
.close { border: 0; background: var(--chip); color: var(--ink); width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 18px; }
.close:focus-visible, .dactions a:focus-visible, .dactions button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.dbody { overflow-y: auto; padding: 16px 20px 24px; min-height: 0; }
.vibe { margin: 0 0 12px; font: 600 16px/1.4 var(--f-display); }
.desc { margin: 0 0 14px; color: var(--muted); }
.dactions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.dactions a, .dactions button {
  font: 600 13px var(--f-body); padding: 8px 12px; border-radius: 9px; text-decoration: none; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel-solid); color: var(--ink);
}
.dactions a.primary { background: var(--ink); color: var(--panel-solid); border-color: var(--ink); }
.md { border-top: 1px solid var(--line); padding-top: 6px; font-size: 14px; line-height: 1.6; }
.md h1, .md h2, .md h3 { font-family: var(--f-display); line-height: 1.2; margin: 1.3em 0 .4em; text-wrap: balance; }
.md h1 { font-size: 20px; } .md h2 { font-size: 17px; } .md h3 { font-size: 15px; }
.md p, .md ul, .md ol { margin: .5em 0; } .md ul, .md ol { padding-left: 1.3em; }
.md code { font: 12.5px var(--f-mono); background: var(--chip); padding: 1px 4px; border-radius: 4px; }
.md pre { background: var(--chip); padding: 10px 12px; border-radius: 8px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md table { border-collapse: collapse; display: block; overflow-x: auto; font-size: 13px; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; }
.md a { color: var(--accent); }
.md blockquote { margin: .6em 0; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }

.loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 5; font: 600 15px var(--f-display); color: var(--muted); pointer-events: none; }
.credit { position: fixed; right: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); z-index: 1; font: 500 11px var(--f-mono); color: var(--muted); }
.credit a { color: inherit; }
.drawer.open ~ .credit { visibility: hidden; }

@media (max-width: 720px) {
  .hud { right: 16px; width: auto; max-height: calc(100% - 120px); padding: 12px 14px; gap: 10px; }
  h1 { font-size: 24px; }
  .sub { display: none; }
  .toggle { display: block; position: absolute; top: 12px; right: 12px; border: 1px solid var(--line); background: var(--panel-solid); color: var(--ink); border-radius: 8px; padding: 6px 10px; font: 600 12px var(--f-body); cursor: pointer; }
  .hud:not(.expanded) .list { display: none; }
  .hud.searching .list { display: flex; max-height: 40vh; }
  .stats { gap: 12px; padding: 8px 12px; right: 112px; justify-content: space-between; }
  .stat b { font-size: 15px; }
  .stat span { font-size: 9px; }
  .controls button { width: 32px; height: 32px; }
  .controls .hide-sm { display: none; }
  .drawer { top: auto; bottom: 0; right: 0; left: 0; width: 100%; height: 72%; border-radius: var(--r) var(--r) 0 0; transform: translateY(105%); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 4; }
  .credit { display: none; }
}
@media (prefers-reduced-motion: reduce) { .drawer { transition: none; } }
</style>
</head>
<body>
<canvas id="world" aria-label="Isometric office floor with every agent of The Agency at work. Use the division list or search to find an agent."></canvas>
<div class="loading" id="loading">Unlocking the office…</div>

<section class="panel hud" id="hud" aria-label="Agency directory">
  <div>
    <div class="eyebrow">The Agency · Floor 1</div>
    <h1>Agency HQ</h1>
    <p class="sub" id="sub">Every specialist, at their desk.</p>
  </div>
  <button class="toggle" id="toggle" aria-expanded="false" aria-controls="list">Divisions</button>
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Find an agent or skill" autocomplete="off" aria-label="Search agents">
    <span class="kbd" aria-hidden="true">/</span>
  </div>
  <div class="list" id="list" role="list"></div>
</section>

<section class="panel stats" aria-live="off" aria-label="Floor activity">
  <div class="stat"><b id="s-work">0</b><span><i class="dot" style="background:#2B55D9"></i>At desks</span></div>
  <div class="stat"><b id="s-walk">0</b><span><i class="dot" style="background:#E0892B"></i>Walking</span></div>
  <div class="stat"><b id="s-chat">0</b><span><i class="dot" style="background:#C2449B"></i>Chatting</span></div>
  <div class="stat"><b id="s-break">0</b><span><i class="dot" style="background:#3E9B6A"></i>On break</span></div>
</section>

<section class="panel controls" aria-label="Camera">
  <button id="zin" title="Zoom in" aria-label="Zoom in">+</button>
  <button id="zout" title="Zoom out" aria-label="Zoom out">−</button>
  <button id="fit" class="hide-sm" title="Show whole floor" aria-label="Show whole floor">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
  <button id="rnd" title="Visit a random agent" aria-label="Visit a random agent">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.2" fill="currentColor"/><circle cx="15" cy="15" r="1.2" fill="currentColor"/><circle cx="15" cy="9" r="1.2" fill="currentColor"/><circle cx="9" cy="15" r="1.2" fill="currentColor"/></svg>
  </button>
</section>

<aside class="panel drawer" id="drawer" aria-label="Agent profile" aria-hidden="true">
  <div class="dhead">
    <div class="avatar" id="d-emoji"></div>
    <div style="min-width:0">
      <h2 id="d-name"></h2>
      <span class="chip" id="d-div"></span>
    </div>
    <button class="close" id="d-close" aria-label="Close profile">×</button>
  </div>
  <div class="dbody">
    <p class="vibe" id="d-vibe"></p>
    <p class="desc" id="d-desc"></p>
    <div class="dactions">
      <a class="primary" id="d-src" href="#" target="_blank" rel="noopener">View source file</a>
      <button id="d-follow" type="button">Stop following</button>
    </div>
    <div class="md" id="d-md"></div>
  </div>
</aside>
<div class="credit">Agents from <a href="https://github.com/msitarzewski/agency-agents" target="_blank" rel="noopener">msitarzewski/agency-agents</a> · MIT</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="app.js"></script>
</body>
</html>
